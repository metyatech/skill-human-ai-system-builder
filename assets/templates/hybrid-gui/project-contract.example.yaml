version: 1

system:
  name: managed-document-workbench
  domain: hybrid-document-workflow
  summary: >
    Humans manage records in a dedicated launcher or dashboard, then edit content in an existing document tool.

actors:
  human:
    role: manager-editor
    primary_goal: Find, status, and open items from a launcher, then edit them in the best native tool.
  ai:
    role: assistant
    primary_goal: Work on canonical structured data and support both management and editing flows.

canonical_store:
  kind: yaml
  location: data/{record_id}.yaml
  version_controlled: true

human_surface:
  mode: hybrid-gui
  kind: launcher-plus-native-editor
  startup:
    kind: launcher
  live_diagnostics: true

ai_surface:
  mode: direct-file
  kind: yaml
  target: canonical_store

sync:
  source_of_truth: canonical_store
  edit_flow:
    human: native-editor-save-applies-through-launcher-service
    ai: direct-edit
  refresh_flow:
    human_surface: launcher-refresh-and-editor-refresh
  conflict_policy:
    detection: base-hash-and-status
    resolution: explicit-user-resolution
    auto_overwrite: false

validation:
  live:
    enabled: true
    surface: human_surface
  save:
    enabled: true
  build_gate:
    enabled: true

outputs:
  generated_dir: generated/{record_id}
  artifacts:
    - final-document
    - pdf
  gitignored: true

gui_selection:
  strategy: hybrid-gui
  reason: Management and editing are both important but belong in different surfaces.

launch:
  human_entrypoints:
    - launcher
    - native-editor
  ai_entrypoint:
    - agent-request

acceptance:
  - Humans can manage items without opening the editor first.
  - Humans can edit in the native document tool when needed.
  - AI works on the same canonical content.
  - The launcher makes sync and conflict state visible.
